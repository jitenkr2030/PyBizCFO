services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bizcfo
      POSTGRES_USER: bizcfo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizcfo -d bizcfo"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bizcfo}:${POSTGRES_PASSWORD:-change-this-password}@db:5432/${POSTGRES_DB:-bizcfo}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_demo && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
volumes:
  postgres_data:
